name: Metrics

on:
  schedule:
    - cron: "0 18 * * *" # 03:00 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["**.svg"] # 액션이 커밋한 SVG로는 재실행 안 함

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.TOKEN }}
          user: bin5537
          template: terminal
          base: header, activity
          config_timezone: Asia/Seoul
          plugin_languages: yes
          plugin_languages_limit: 6
          filename: github-metrics.svg
